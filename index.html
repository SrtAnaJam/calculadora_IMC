<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="text-white">
    <div class="w-full h-screen bg-[#18171C] flex items-center justify-center">
        <div class="w-[50%] h-full flex items-center justify-center">
            <img width = "700px"src="./images/workout-animate.svg" alt="imagem animada">

        </div>
        <div class="w-1/2 h-full flex items-center justify-center">
            <div class="w-[80%] h-auto min-h-[400px] bg-[#262626] py-[30px] px-[20px] rounded-md">
                <h1 class="text-[40px] font-bold">Calculadora-IMC</h1>
                <div class="w-[19%] h-[2px] bg-[#17A34a] rounded-md"></div>

                <label for="" class="mt-[20px] text-[20px] font-bold block md-[10px]">Peso em Kg</label>
                <div class="w-full h-[50px] bg-[#3F3F47] relative">
                    
                    <input type="number" name="" id="peso" class="w-full h-full bg-transparent border-none outline-none pl-[40px] pr-[40px]">
                    <i class="fa-solid fa-weight-hanging absolute left-2 top-1/2 -translate-y-1/2 text -[20px]"></i>
                    <p class="absolute right-2 top-1/2 -translate-y-1/2">Kg</p>
                </div>
                <label for="" class="mt-[20px] text-[20px] font-bold block md-[10px]">Altura em metros</label>
                <div class="w-full h-[60px] bg-[#3f3f47] flex">
                    <div class="w-[7%] h-full flex items-center justify-center">
                        <i class="fa-solid fa-ruler "></i>
                    </div>
                    <input type="number" name="" id="altura"class="w-[86%] h-full bg-transparent border-none outline-none">
                    <div class="w-[7%] h-full flex items-center justify-center">m
                    </div>
                </div>
                <button id="botao"="w-full h-[60px] bg-[#17A34a] cursor-pointer text-[20px] font-bold mt-[20px] rounded-md">
                    Calcular
                </button>
                <div class="w-full h-[1px] bg-[#3F3F47] my-[20px]"></div>
                <div class="w-full flex h-[150px]">
                    <div class="w-[20%] h-full flex intems-center flex-col">
                        <p class="text-[40px] text-[#17a34a] font-[450]">20,81</p>
                        <p>Seu IMC</p>
                    </div>
                    <div class="w-[80%] h-full flex items-center justify-center text-center">
                            <p class="font-[450] text-[20px]">Você está no peso ideal!</p>
                        </div>
                    
                    </div><div class="w-full h-[1px] bg-[#3F3F47] my-[20px]"></div>
                </div>
            </div>

        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
